# 🔮 한국형 만세력 운세 시스템 — 통합 CI/CD 파이프라인
# build-and-test → docker → deploy 를 needs 로 연결한 단일 파이프라인.
#   - PR / develop·master push : build-and-test
#   - master push (또는 workflow_dispatch) : docker(GHCR) → deploy(SSH)
name: CI/CD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# 같은 ref 의 동시 실행 직렬화 — latest 태그 푸시/배포 경쟁 방지.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. BUILD & TEST — 모든 push / PR
  # ──────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: corretto
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & test
        run: >
          ./gradlew build --no-daemon
          -x processAot
          -x compileAotJava
          -x processAotResources
          -x aotClasses
          -x processTestAot
          -x compileAotTestJava
          -x processAotTestResources
          -x aotTestClasses

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 7

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/korean-fortune-app.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # 2. DOCKER BUILD & PUSH — master push / dispatch (테스트 통과 후)
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download verified JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime-ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Print image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"

  # ──────────────────────────────────────────────────────────────
  # 3. DEPLOY — master push / dispatch (Docker 게시 후, SSH)
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, macOS, x64]
    needs: docker
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Notify deploy started
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CICD_WEBHOOK_URL }}
        run: |
          set -eu
          [ -n "$DISCORD_WEBHOOK_URL" ] || { echo "Discord webhook not configured"; exit 0; }
          payload=$(jq -n --arg title "Deploy started" --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{embeds:[{title:$title,url:$url,color:16776960,fields:[{name:"Step",value:"Deploy to Production",inline:true},{name:"Commit",value:(env.GITHUB_SHA[0:12]),inline:true}]}]}')
          curl --fail --silent --show-error --max-time 10 -H 'Content-Type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL"

      - name: Deploy on self-hosted runner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CICD_WEBHOOK_URL }}
        run: |
            set -Eeuo pipefail
            notify_step() {
              [ -n "$DISCORD_WEBHOOK_URL" ] || return 0
              local step="$1" result="$2"
              local color=16776960
              [ "$result" = "success" ] && color=3066993
              [ "$result" = "failure" ] && color=15158332
              payload=$(jq -n --arg step "$step" --arg result "$result" --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" --argjson color "$color" '{embeds:[{title:("Deploy step: " + $step),url:$url,color:$color,fields:[{name:"Result",value:$result,inline:true}]}]}')
              curl --fail --silent --show-error --max-time 10 -H 'Content-Type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL" || true
            }
            notify_step "GHCR 로그인" "started"
            echo "🔐 Logging in to GitHub Container Registry..."
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            notify_step "GHCR 로그인" "success"

            export APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}"
            notify_step "검증 이미지 Pull" "started"
            echo "📥 Pulling immutable image: $APP_IMAGE"
            docker pull "$APP_IMAGE"
            notify_step "검증 이미지 Pull" "success"

            # actions/checkout이 검증한 현재 commit을 그대로 배포한다.
            # 별도 장기 checkout은 stale 상태일 수 있으므로 사용하지 않는다.
            cd "$GITHUB_WORKSPACE"
            COMPOSE=(docker compose -f docker/docker-compose.yaml -f docker/docker-compose.prod.yaml -f docker/docker-compose.openbao.override.yml)
            PREVIOUS_APP_IMAGE="$(docker inspect docker-app-1 --format '{{.Config.Image}}' 2>/dev/null || true)"
            DEPLOY_COMPLETE=false

            recover_on_failure() {
              local exit_code=$?
              trap - EXIT INT TERM
              if [ "$DEPLOY_COMPLETE" != "true" ]; then
                echo "⚠️ Deploy interrupted or failed; restoring an application container..."
                if [ -n "$PREVIOUS_APP_IMAGE" ]; then
                  export APP_IMAGE="$PREVIOUS_APP_IMAGE"
                fi
                "${COMPOSE[@]}" up -d --no-build || true
              fi
              exit "$exit_code"
            }
            trap recover_on_failure EXIT INT TERM

            FULL_DEPLOY=false
            BEFORE_SHA="${{ github.event.before }}"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
              || [ -z "$BEFORE_SHA" ] \
              || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              FULL_DEPLOY=true
            elif ! git diff --quiet "$BEFORE_SHA" "${{ github.sha }}" -- docker/ ops/openbao/; then
              FULL_DEPLOY=true
            fi

            if [ "$FULL_DEPLOY" = "false" ]; then
              SECRET_HEALTH="$(docker inspect korean-fortune-openbao-secrets --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' 2>/dev/null || true)"
              if [ "$SECRET_HEALTH" != "healthy" ] || ! docker volume inspect docker_openbao_secrets >/dev/null 2>&1; then
                echo "⚠️ OpenBao runtime state is unavailable; falling back to full deploy."
                FULL_DEPLOY=true
              fi
            fi

            if [ "$FULL_DEPLOY" = "true" ]; then
              notify_step "전체 Compose 교체" "started"
              echo "🧱 Infrastructure change detected; performing full deploy."
              "${COMPOSE[@]}" --profile '*' down --remove-orphans || true
              for container in docker-app-1 korean-fortune-standalone korean-fortune-logs-init korean-fortune-openbao-secrets korean-fortune-mysql korean-fortune-redis korean-fortune-nginx korean-fortune-prometheus korean-fortune-grafana korean-fortune-elasticsearch korean-fortune-logstash korean-fortune-kibana; do
                docker rm -f "$container" 2>/dev/null || true
              done
              docker volume rm docker_openbao_secrets 2>/dev/null || true
              blocker="$(docker ps --filter "publish=18080" --format '{{.Names}}' | head -n 1)"
              if [ -n "$blocker" ]; then
                echo "❌ Host port 18080 is already allocated by $blocker"
                exit 1
              fi
              "${COMPOSE[@]}" up -d --no-build
              notify_step "전체 Compose 교체" "success"
            else
              notify_step "앱 컨테이너 교체" "started"
              echo "⚡ Application-only change detected; preserving MySQL and OpenBao containers."
              "${COMPOSE[@]}" up -d --no-deps --force-recreate --no-build app
              notify_step "앱 컨테이너 교체" "success"
            fi

            notify_step "애플리케이션 헬스체크" "started"
            echo "⏳ Waiting for application to become healthy..."
            HEALTH_URL="http://localhost:18080/actuator/health"
            MAX_RETRIES=60
            RETRY_INTERVAL=3
            for i in $(seq 1 $MAX_RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Application is healthy (attempt $i/$MAX_RETRIES)"
                notify_step "애플리케이션 헬스체크" "success"
                break
              fi
              echo "⏳ Attempt $i/$MAX_RETRIES: status=$STATUS — retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
              if [ $i -eq $MAX_RETRIES ]; then
                echo "❌ Health check failed after $MAX_RETRIES attempts"
                notify_step "애플리케이션 헬스체크" "failure"
                "${COMPOSE[@]}" logs --tail=50 app
                exit 1
              fi
            done

            DEPLOY_COMPLETE=true
            trap - EXIT INT TERM
            "${COMPOSE[@]}" ps
            echo "✅ Deployment complete!"

      - name: Notify deploy finished
        if: ${{ always() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CICD_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          set -eu
          [ -n "$DISCORD_WEBHOOK_URL" ] || { echo "Discord webhook not configured"; exit 0; }
          color=3066993
          [ "$DEPLOY_RESULT" = "success" ] || color=15158332
          payload=$(jq -n --arg title "Deploy finished: $DEPLOY_RESULT" --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" --arg result "$DEPLOY_RESULT" --argjson color "$color" '{embeds:[{title:$title,url:$url,color:$color,fields:[{name:"Step",value:"Deploy to Production",inline:true},{name:"Result",value:$result,inline:true}]}]}')
          curl --fail --silent --show-error --max-time 10 -H 'Content-Type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL"

  # ──────────────────────────────────────────────────────────────
  # 4. DISCORD STATUS — master 배포 결과 알림
  # ──────────────────────────────────────────────────────────────
  deployment-status:
    name: Discord Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-test, docker, deploy]
    if: always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Send deployment status to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CICD_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -eu
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_CICD_WEBHOOK_URL 미설정 — 배포 알림을 건너뜁니다."
            exit 0
          fi
          status="success"
          color=3066993
          if [ "$BUILD_RESULT" != "success" ] || [ "$DOCKER_RESULT" != "success" ] || [ "$DEPLOY_RESULT" != "success" ]; then
            status="failure"
            color=15158332
          fi
          payload=$(jq -n \
            --arg title "CI/CD deployment $status" \
            --arg description "${{ github.repository }} / ${{ github.ref_name }}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg sha "${GITHUB_SHA:0:12}" \
            --arg build "$BUILD_RESULT" \
            --arg docker "$DOCKER_RESULT" \
            --arg deploy "$DEPLOY_RESULT" \
            --argjson color "$color" \
            '{embeds:[{title:$title,description:$description,url:$url,color:$color,fields:[{name:"Build & Test",value:$build,inline:true},{name:"Docker",value:$docker,inline:true},{name:"Deploy",value:$deploy,inline:true},{name:"Commit",value:$sha,inline:false}]}]}')
          curl --fail --silent --show-error --max-time 10 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
