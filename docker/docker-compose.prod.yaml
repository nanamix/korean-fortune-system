services:
  mysql:
    # 애플리케이션은 Compose 내부 network로 접속하므로 운영 host에 3306을 노출하지 않는다.
    ports: !reset []

  app:
    # 운영은 CI 가 GHCR 에 게시한 이미지를 사용(로컬 빌드 대신). 배포 스크립트가 pull 후 up.
    image: ${APP_IMAGE:-ghcr.io/nanamix/korean-fortune-system:latest}
    environment:
      # DB-only cutover 이후 기본 운영 조합. rollback 시 SPRING_PROFILES_ACTIVE=prod로 덮어쓴다.
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod,supabase}
      # @Scheduled placeholder는 configtree의 대문자 key로 비활성화되지 않으므로 환경변수로 고정한다.
      - APP_FORTUNE_NOTIFICATION_SCHEDULE_CRON=${APP_FORTUNE_NOTIFICATION_SCHEDULE_CRON:--}
      - JAVA_OPTS=-Xms1g -Xmx2g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError
    deploy:
      # 단일 host port 18080을 사용하므로 Compose 운영은 replica 1로 제한한다.
      replicas: 1
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
